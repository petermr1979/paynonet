<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Генератор иконок PNN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .icon-item {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
        }
        .icon-item svg {
            width: 100%;
            height: auto;
        }
        .icon-item p {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>PNN Иконки для PWA</h1>
    <p>Откройте этот файл в браузере, затем кликните правой кнопкой на иконке → «Сохранить как» для каждого размера</p>
