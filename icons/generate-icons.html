<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNN Icon Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .icon-container {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
        }
        canvas {
            border-radius: 20%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        button {
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            border: none;
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>🎨 Генератор иконок PNN</h1>
    <p>Нажмите кнопку для генерации и скачивания всех иконок</p>
    <button onclick="generateAllIcons()">Сгенерировать иконки</button>
    
    <div class="grid" id="grid"></div>
    
    <script>
        const sizes = [
            { size: 72, name: 'icon-72.png' },
            { size: 96, name: 'icon-96.png' },
            { size: 128, name: 'icon-128.png' },
            { size: 144, name: 'icon-144.png' },
            { size: 152, name: 'icon-152.png' },
            { size: 180, name: 'icon-180.png' },
            { size: 192, name: 'icon-192.png' },
            { size: 384, name: 'icon-384.png' },
            { size: 512, name: 'icon-512.png' }
        ];
        
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(1, '#1a1a3e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Rounded corners mask
            ctx.save();
            ctx.beginPath();
            const radius = size * 0.2;
            ctx.roundRect(0, 0, size, size, radius);
            ctx.clip();
            
            // Card shape
            const cardW = size * 0.586;
            const cardH = size * 0.371;
            const cardX = size * 0.207;
            const cardY = size * 0.352;
            
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = size * 0.004;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, size * 0.04);
            ctx.fill();
            ctx.stroke();
            
            // NFC waves
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = size * 0.008;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                const centerX = size * 0.625;
                const centerY = size * 0.539;
                const radius = size * (0.08 + i * 0.04);
                ctx.arc(centerX, centerY, radius, -0.3, 0.3);
                ctx.globalAlpha = 0.8 - i * 0.2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            
            // PNN Text with glow
            ctx.fillStyle = '#00d4ff';
            ctx.font = `bold ${size * 0.094}px -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#00d4ff';
            ctx.shadowBlur = size * 0.04;
            ctx.fillText('PNN', size / 2, size * 0.273);
            ctx.shadowBlur = 0;
            
            // Chip
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.roundRect(size * 0.266, size * 0.43, size * 0.098, size * 0.068, size * 0.012);
            ctx.fill();
            
            ctx.restore();
        }
        
        function generateAllIcons() {
            sizes.forEach(({ size, name }) => {
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    drawIcon(canvas, size);
                    
                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = name;
                        a.click();
                        URL.revokeObjectURL(url);
                    }, 'image/png');
                }, sizes.indexOf({ size, name }) * 100);
            });
            
            alert('Иконки генерируются и скачиваются автоматически!');
        }
        
        // Preview on load
        window.onload = () => {
            const grid = document.getElementById('grid');
            sizes.slice(0, 6).forEach(({ size, name }) => {
                const container = document.createElement('div');
                container.className = 'icon-container';
                
                const canvas = document.createElement('canvas');
                drawIcon(canvas, Math.min(size, 180));
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                
                const label = document.createElement('p');
                label.textContent = `${name} (${size}x${size})`;
                label.style.marginTop = '10px';
                label.style.fontSize = '14px';
                label.style.color = 'rgba(255,255,255,0.7)';
                
                container.appendChild(canvas);
                container.appendChild(label);
                grid.appendChild(container);
            });
        };
    </script>
</body>
</html>
