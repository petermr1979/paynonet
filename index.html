<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PNN Wallet">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="description" content="Мобильное приложение для управления банковскими токенами">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS иконки -->
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" sizes="512x512" href="assets/icon-512.svg">
  
  <title>PNN Wallet</title>
  
  <!-- Стили -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Основной контейнер -->
  <div id="app">
    
    <!-- Header -->
    <header class="header">
      <button class="header-btn profile-btn" id="profileBtn" aria-label="Профиль">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M12 14C8 14 4 16 4 20V21H20V20C20 16 16 14 12 14Z" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      
      <div class="logo">
        <img src="assets/icon-192.svg" alt="PNN Wallet" class="logo-img" id="logoImg">
      </div>
      
      <button class="header-btn add-btn" id="addCardBtn" aria-label="Добавить карту">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    
    <!-- Основной контент -->
    <main class="main-content">
      
      <!-- Секция с карточками токенов -->
      <section class="cards-section">
        <div class="cards-grid" id="cardsGrid">
          <!-- Карточки будут добавлены динамически -->
        </div>
      </section>
      
      <!-- Большая нижняя карта -->
      <section class="big-card-section hidden" id="bigCardSection">
        <div class="big-card-container">
          <div class="big-card" id="bigCard">
            <div class="big-card-content">
              <div class="big-card-chip"></div>
              <div class="big-card-number">•••• •••• •••• 0000</div>
              <div class="big-card-info">
                <span class="big-card-label">Cardholder</span>
                <span class="big-card-value">CARD HOLDER</span>
              </div>
            </div>
            <div class="big-card-overlay" id="bigCardOverlay">
              <canvas id="flightCanvas"></canvas>
              <button class="cancel-btn" id="cancelPaymentBtn">ОТМЕНА</button>
            </div>
          </div>
        </div>
      </section>
      
    </main>
    
    <!-- Навигационная панель -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="main" aria-label="Основное">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
          <line x1="2" y1="9" x2="22" y2="9" stroke="currentColor" stroke-width="2"/>
          <line x1="7" y1="14" x2="11" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="tab-btn" data-tab="history" aria-label="История">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 7V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>
    
    <!-- Модальное окно добавления карты -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard">
        <div class="modal-header">
          <h2 class="modal-title">Новая карта</h2>
          <button class="star-btn" id="starBtn" aria-label="Сделать основной">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path class="star-outline" d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        
        <div class="modal-body">
          <div class="input-group">
            <label class="input-label">Номер карты</label>
            <input 
              type="tel" 
              class="input-field" 
              id="cardNumber" 
              placeholder="0000 0000 0000 0000"
              maxlength="19"
              inputmode="numeric"
              autocomplete="cc-number"
            >
          </div>
          
          <div class="input-row">
            <div class="input-group">
              <label class="input-label">Срок действия</label>
              <input 
                type="tel" 
                class="input-field" 
                id="expiryDate" 
                placeholder="MM/YY"
                maxlength="5"
                inputmode="numeric"
                autocomplete="cc-exp"
              >
            </div>
            
            <div class="input-group">
              <label class="input-label">CVV</label>
              <input 
                type="password" 
                class="input-field" 
                id="cvv" 
                placeholder="•••"
                maxlength="3"
                inputmode="numeric"
                autocomplete="cc-csc"
              >
            </div>
          </div>
        </div>
        
        <div class="modal-footer">
          <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
          <button class="btn btn-ok" id="okBtn" disabled>OK</button>
        </div>
      </div>
    </div>
    
    <!-- Экран загрузки токенизации -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <p class="loading-text">Токенизация карты...</p>
    </div>
    
  </div>
  
  <!-- Скрипты -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
