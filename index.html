<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-title" content="PNN">
    <title>PNN - Заплати Без Сети</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Верхняя панель -->
        <header class="top-bar">
            <div class="avatar" id="avatar">
                <span id="avatar-initials">ПМ</span>
            </div>
            <div class="logo">
                <svg viewBox="0 0 120 40" class="logo-svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <text x="60" y="28" text-anchor="middle" fill="url(#logoGradient)" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">PNN</text>
                </svg>
            </div>
            <button class="add-btn" id="addCardBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </header>

        <!-- Основная область с каруселью карт -->
        <main class="main-content">
            <div class="cards-carousel" id="cardsCarousel">
                <div class="cards-container" id="cardsContainer">
                    <!-- Карты будут добавлены через JS -->
                </div>
            </div>
        </main>

        <!-- Нижняя панель навигации -->
        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="home">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Главная</span>
            </button>
            <button class="tab-btn" data-tab="history">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                </svg>
                <span>История</span>
            </button>
        </nav>

        <!-- Модальное окно добавления карты -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card" id="modalCard">
                <div class="modal-header">
                    <h2>Добавить карту</h2>
                    <button class="star-btn" id="starBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                        </svg>
                    </button>
                </div>
                <form id="addCardForm">
                    <div class="form-group">
                        <label for="cardNumber">Номер карты</label>
                        <input type="tel" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="23" autocomplete="cc-number">
                        <span class="error-msg" id="cardNumberError">Карта должна быть платёжной системы "Мир"</span>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiryDate">Срок действия</label>
                            <input type="tel" id="expiryDate" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp">
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="tel" id="cvv" placeholder="123" maxlength="3" autocomplete="cc-csc">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cardholderName">Имя держателя</label>
                        <input type="text" id="cardholderName" placeholder="IVAN IVANOV" maxlength="26" autocomplete="cc-name">
                    </div>
                </form>
                <div class="modal-actions">
                    <button class="btn-cancel" id="cancelBtn">Отмена</button>
                    <button class="btn-ok" id="okBtn" disabled>OK</button>
                </div>
            </div>
        </div>

        <!-- Экран передачи токена (гиперпространство) -->
        <div class="hyperspace-overlay" id="hyperspaceOverlay">
            <div class="stars" id="stars"></div>
            <div class="transfer-content">
                <div class="pulse-ring"></div>
                <div class="transfer-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <p class="transfer-text">Передача токена…</p>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ble.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
